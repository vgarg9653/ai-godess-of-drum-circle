document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

roke-linecap=\"round\" transform=\"rotate(180 50 50)\" style=\"animation:gdcSeq 4.8s linear infinite;animation-delay:2.4s\"><\u002Fline>\n    <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"15\" stroke=\"#f6ecd9\" stroke-width=\"2.6\" stroke-linecap=\"round\" transform=\"rotate(210 50 50)\" style=\"animation:gdcSeq 4.8s linear infinite;animation-delay:2.8s\"><\u002Fline>\n    <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"18\" stroke=\"#f6ecd9\" stroke-width=\"2.6\" stroke-linecap=\"round\" transform=\"rotate(240 50 50)\" style=\"animation:gdcSeq 4.8s linear infinite;animation-delay:3.2s\"><\u002Fline>\n    <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"15\" stroke=\"#f6ecd9\" stroke-width=\"2.6\" stroke-linecap=\"round\" transform=\"rotate(270 50 50)\" style=\"animation:gdcSeq 4.8s linear infinite;animation-delay:3.6s\"><\u002Fline>\n    <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"22\" stroke=\"#f6ecd9\" stroke-width=\"2.6\" stroke-linecap=\"round\" transform=\"rotate(300 50 50)\" style=\"animation:gdcSeq 4.8s linear infinite;animation-delay:4s\"><\u002Fline>\n    <line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"15\" stroke=\"#f6ecd9\" stroke-width=\"2.6\" stroke-linecap=\"round\" transform=\"rotate(330 50 50)\" style=\"animation:gdcSeq 4.8s linear infinite;animation-delay:4.4s\"><\u002Fline>\n    <circle cx=\"50\" cy=\"13\" r=\"4.6\" fill=\"#ffaa33\" style=\"filter:drop-shadow(0 0 7px rgba(255,170,51,.9));animation:gdcBeat 4.8s ease-out infinite;transform-origin:50px 13px\"><\u002Fcircle>\n  <\u002Fsvg>\n  <div style=\"font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#ffc95c;margin-top:30px;padding-left:.5em\">Goddess of<\u002Fdiv>\n  <div style=\"font-family:'Rozha One',serif;font-size:48px;line-height:1.04;margin-top:6px\">Drum Circle<\u002Fdiv>\n  <div style=\"font-size:15px;line-height:1.55;color:rgba(246,236,217,.62);margin-top:16px;max-width:250px;text-wrap:pretty\">Sit down. Tap. Nobody can play a wrong note here.<\u002Fdiv>\n  <button sc-camel-on-click=\"{{ startCircle }}\" style=\"margin-top:38px;padding:19px 46px;border:none;border-radius:999px;background:linear-gradient(135deg,#ff5638,#ffaa33);color:#2a1106;font-size:17px;font-weight:700;letter-spacing:.02em;box-shadow:0 0 38px rgba(255,140,50,.35),inset 0 0 0 1px rgba(255,255,255,.28)\">Start a Circle<\u002Fbutton>\n  <button sc-camel-on-click=\"{{ joinLink }}\" style=\"margin-top:18px;background:none;border:none;color:rgba(246,236,217,.55);font-size:13.5px;letter-spacing:.03em;text-decoration:underline;text-underline-offset:4px\">or join with a link<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isJoin }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"2 · Join\" style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:36px\">\n  <div style=\"font-size:11.5px;letter-spacing:.42em;text-transform:uppercase;color:#ffc95c\">Tonight’s circle<\u002Fdiv>\n  <div style=\"font-family:'Rozha One',serif;font-size:31px;line-height:1.2;margin-top:14px;text-wrap:pretty\">What should the circle call you?<\u002Fdiv>\n  <input value=\"{{ typedVal }}\" sc-camel-on-input=\"{{ onName }}\" sc-camel-on-key-down=\"{{ onNameKey }}\" sc-camel-auto-focus=\"{{ true }}\" placeholder=\"Your first name\" autocomplete=\"off\" style=\"margin-top:40px;width:100%;background:transparent;border:none;border-bottom:2px solid rgba(246,236,217,.3);color:#f6ecd9;font-size:30px;font-weight:500;padding:8px 2px 14px;border-radius:0;caret-color:#ffaa33\">\n  <sc-if value=\"{{ hostFlowVal }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"margin-top:34px\">\n    <div style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(246,236,217,.5)\">how big will tonight’s circle be?<\u002Fdiv>\n    <div style=\"display:flex;gap:10px;margin-top:14px\">\n      <sc-for list=\"{{ sizeOpts }}\" as=\"so\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ so.pick }}\" style=\"flex:1;padding:12px 6px;border-radius:12px;background:{{ so.bg }};border:1px solid {{ so.bc }};color:#f6ecd9;display:flex;flex-direction:column;gap:3px;align-items:center\">\n          <span style=\"font-size:13.5px;font-weight:600\">{{ so.label }}<\u002Fspan>\n          <span style=\"font-size:11px;color:rgba(246,236,217,.5)\">{{ so.sub }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:11.5px;line-height:1.5;color:rgba(246,236,217,.4);margin-top:10px;text-wrap:pretty\">A circle needs three to breathe — one pulse, one ground, one voice. Instruments stay balanced as people join.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <button sc-camel-on-click=\"{{ doJoin }}\" style=\"margin-top:44px;align-self:flex-start;padding:17px 40px;border:none;border-radius:999px;background:linear-gradient(135deg,#ff5638,#ffaa33);color:#2a1106;font-size:16px;font-weight:700;box-shadow:0 0 30px rgba(255,140,50,.3);opacity:{{ joinOp }};transition:opacity .3s\">Step into the circle<\u002Fbutton>\n  <div style=\"margin-top:22px;font-size:12.5px;color:rgba(246,236,217,.4)\">No account. No email. Just your name in the ring.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"3 · Loading gate\" style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px\">\n  <svg width=\"216\" height=\"216\" sc-camel-view-box=\"0 0 200 200\" style=\"overflow:visible\">\n    <circle cx=\"100\" cy=\"100\" r=\"88\" sc-camel-path-length=\"100\" fill=\"none\" stroke=\"#ffaa33\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-dasharray=\"100\" stroke-dashoffset=\"{{ ringD1 }}\" transform=\"rotate(-90 100 100)\"><\u002Fcircle>\n    <circle cx=\"100\" cy=\"100\" r=\"70\" sc-camel-path-length=\"100\" fill=\"none\" stroke=\"#ff3d9a\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"100\" stroke-dashoffset=\"{{ ringD2 }}\" transform=\"rotate(-90 100 100)\"><\u002Fcircle>\n    <circle cx=\"100\" cy=\"100\" r=\"52\" sc-camel-path-length=\"100\" fill=\"none\" stroke=\"#3fe3cd\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"100\" stroke-dashoffset=\"{{ ringD3 }}\" transform=\"rotate(-90 100 100)\"><\u002Fcircle>\n    <circle cx=\"100\" cy=\"100\" r=\"34\" fill=\"none\" stroke=\"#f6ecd9\" stroke-width=\"1\" stroke-dasharray=\"2 6\" opacity=\"0.35\"><\u002Fcircle>\n    <circle cx=\"100\" cy=\"100\" r=\"6\" fill=\"#ffc95c\" style=\"filter:drop-shadow(0 0 9px rgba(255,201,92,.85));animation:gdcBreathe 2.4s ease-in-out infinite;transform-origin:100px 100px\"><\u002Fcircle>\n  <\u002Fsvg>\n  <div style=\"height:76px;margin-top:30px;position:relative;width:100%\">\n    <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:{{ loadBusyOp }};transition:opacity .6s\">\n      <div style=\"font-family:'Rozha One',serif;font-size:21px;color:#f6ecd9\">{{ loadName }}<\u002Fdiv>\n      <div style=\"font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:rgba(246,236,217,.45);padding-left:.4em\">gathering the instruments<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:{{ loadReadyOp }};transition:opacity .9s\">\n      <div style=\"font-family:'Rozha One',serif;font-size:27px;color:#ffc95c\">You’re ready.<\u002Fdiv>\n      <div style=\"font-size:13px;color:rgba(246,236,217,.55)\">The room is waiting.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSoundcheck }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"4 · Sound check\" style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:32px 30px\">\n  <div style=\"font-size:11.5px;letter-spacing:.42em;text-transform:uppercase;color:#ffc95c\">Before you sit down<\u002Fdiv>\n  <div style=\"font-family:'Rozha One',serif;font-size:30px;line-height:1.2;margin-top:12px\">Can you hear the room?<\u002Fdiv>\n  <div style=\"margin-top:34px;display:flex;align-items:center;gap:16px\">\n    <div style=\"flex:1\">\n      <input type=\"range\" min=\"0\" max=\"100\" value=\"{{ vol }}\" sc-camel-on-input=\"{{ onVol }}\">\n      <div style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(246,236,217,.45);margin-top:4px\">drag — every move plays a test hit<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#ffaa33 0%,rgba(255,170,51,.25) 60%,transparent 75%);transform:{{ hitScale }};opacity:{{ hitOp }};transition:transform .25s cubic-bezier(.2,.9,.3,1.4),opacity .25s\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:34px;display:flex;gap:18px;align-items:center;padding:20px;border:1px solid rgba(255,170,51,.3);border-radius:14px;background:rgba(255,170,51,.05)\">\n    <svg width=\"54\" height=\"80\" sc-camel-view-box=\"0 0 64 92\" style=\"flex:none\">\n      <rect x=\"26\" y=\"6\" width=\"34\" height=\"80\" rx=\"8\" fill=\"none\" stroke=\"rgba(246,236,217,.55)\" stroke-width=\"2\"><\u002Frect>\n      <rect x=\"15\" y=\"22\" width=\"8\" height=\"15\" rx=\"3\" fill=\"#ffaa33\" style=\"filter:drop-shadow(0 0 5px rgba(255,170,51,.8))\"><\u002Frect>\n      <path d=\"M11 52 C 5 45 5 36 10 30\" fill=\"none\" stroke=\"#3fe3cd\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath>\n      <path d=\"M10 30 l -4.5 1.5 M10 30 l 1 4.5\" fill=\"none\" stroke=\"#3fe3cd\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath>\n    <\u002Fsvg>\n    <div style=\"font-size:14.5px;line-height:1.5;color:rgba(246,236,217,.85);text-wrap:pretty\">On an iPhone? <strong style=\"color:#ffc95c\">Flick your ringer switch on<\u002Fstrong> — otherwise your phone stays silent.<\u002Fdiv>\n  <\u002Fdiv>\n  <button sc-camel-on-click=\"{{ toSoundDone }}\" style=\"margin-top:40px;align- in-top:18px\">\n    <div style=\"font-family:'Rozha One',serif;font-size:40px;line-height:1\">{{ instName }}<\u002Fdiv>\n    <div style=\"font-family:'Rozha One',serif;font-size:26px;color:#ffc95c\">{{ instDev }}<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:14px;padding:7px 16px;border:1px solid rgba(246,236,217,.3);border-radius:999px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,236,217,.75)\">{{ instFeel }}<\u002Fdiv>\n  <div style=\"margin-top:12px;font-size:12px;color:rgba(246,236,217,.4)\">tap the emblem to hear it<\u002Fdiv>\n  <button sc-camel-on-click=\"{{ takeSeat }}\" style=\"margin-top:30px;padding:18px 44px;border:none;border-radius:999px;background:linear-gradient(135deg,#ff5638,#ffaa33);color:#2a1106;font-size:16px;font-weight:700;box-shadow:0 0 30px rgba(255,140,50,.3)\">Take your seat<\u002Fbutton>\n  <button sc-camel-on-click=\"{{ toggleSwap }}\" style=\"margin-top:16px;background:none;border:none;color:rgba(246,236,217,.55);font-size:13.5px;text-decoration:underline;text-underline-offset:4px\">swap instrument<\u002Fbutton>\n  <sc-if value=\"{{ swapOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;left:0;right:0;bottom:0;background:rgba(13,9,23,.97);border-top:1px solid rgba(255,170,51,.3);border-radius:22px 22px 0 0;padding:22px 24px 30px;animation:gdcSheet .35s ease both;box-shadow:0 -20px 60px rgba(0,0,0,.6)\">\n    <div style=\"font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:rgba(246,236,217,.5);text-align:center;margin-bottom:6px\">how do you want to sound?<\u002Fdiv>\n    <div style=\"font-size:11.5px;color:rgba(246,236,217,.38);text-align:center;margin-bottom:14px\">the circle offers only the voices it needs — harmony first<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <sc-for list=\"{{ swaps }}\" as=\"sw\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ sw.pick }}\" style=\"display:flex;align-it height:{{ nd.s }};border-radius:50%;background:{{ nd.bg }};box-shadow:{{ nd.ring }};margin:0 auto;display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 48 48\" style=\"width:80%;height:80%\"><path d=\"{{ nd.icon }}\" fill=\"none\" stroke=\"#140c26\" stroke-width=\"3.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"font-size:10px;letter-spacing:.06em;color:rgba(246,236,217,.6);white-space:nowrap;text-align:center;margin-top:5px\">{{ nd.nm }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center\">\n      <div style=\"font-family:'Rozha One',serif;font-size:56px;line-height:1;color:#f6ecd9\">{{ count }}<\u002Fdiv>\n      <div style=\"font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:rgba(246,236,217,.5);margin-top:6px;padding-left:.3em\">in the circle<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ isHostVal }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ begin }}\" style=\"padding:18px 52px;border:none;border-radius:999px;background:linear-gradient(135deg,#ff5638,#ffaa33);color:#2a1106;font-size:17px;font-weight:700;box-shadow:0 0 36px rgba(255,140,50,.35)\">Begin<\u002Fbutton>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ notHost }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"font-size:13px;color:rgba(246,236,217,.5);animation:gdcBreathe 3.4s ease-in-out infinite\">the host will begin soon<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPlay }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"7 · Play\" style=\"position:absolute;inset:0\">\n  <canvas ref=\"{{ playCanvas }}\" style=\"position:absolute;inset:0;width:100%;height:100%;touch-action:none\"><\u002Fcanvas>\n  <div style=\"position:absolute;top:20px;left:22px;display:flex;align-items:center;gap:9px;opacity:{{ chromeOp }};transition:opacity 2.6s ease;pointer-events:none\">\n    <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"none\" stroke=\"#ffc95c\" stroke-width=\"6\" stroke-dasharray=\"14 9\"><\u002Fcircle><circle cx=\"50\" cy=\"10\" r=\"9\" fill=\"#ffaa33\"><\u002Fcircle><\u002Fsvg>\n    <span style=\"font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:rgba(246,236,217,.5)\">Drum Circle<\u002Fspan>\n  <\u002Fdiv>\n  <sc-if value=\"{{ labelShow }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;left:{{ labelX }}px;top:{{ labelY }}px;transform:translate(-50%,-100%);text-align:center;pointer-events:none;animation:gdcRise .3s ease both\">\n      <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 48 48\" style=\"display:block;margin:0 auto 3px\"><path d=\"{{ labelIcon }}\" fill=\"none\" stroke=\"#ffc95c\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <div style=\"font-family:'Rozha One',serif;font-size:16px;color:#f6ecd9;text-shadow:0 2px 12px rgba(0,0,0,.8)\">{{ labelName }}<\u002Fdiv>\n      <div style=\"font-size:11px;color:rgba(246,236,217,.7);text-shadow:0 2px 10px rgba(0,0,0,.8)\">{{ labelInst }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showReconnect }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;background:rgba(13,9,23,.85);border:1px solid rgba(63,227,205,.35);animation:gdcGlowIn .5s ease both\">\n      <span style=\"width:8px;height:8px;border-radius:50%;background:#3fe3cd;box-shadow:0 0 10px #3fe3cd;animation:gdcBreathe 2s ease-in-out infinite;flex:none\"><\u002Fspan>\n      <span style=\"font-size:12.5px;color:rgba(246,236,217,.85);white-space:nowrap\">The circle is holding your place<\u002Fspan>\n    <\u002Fdiv>
